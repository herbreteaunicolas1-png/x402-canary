name: x402 Distribution Visibility Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/catalog-authority.ts"
      - "src/openapi.ts"
      - "src/payment.ts"
      - "src/index.ts"
      - "src/public-distribution.ts"
      - "src/need-router.ts"
      - "migrations/0003_need_signals.sql"
      - "test/**"
      - ".github/workflows/distribution-visibility-gate.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: x402-distribution-visibility-main
  cancel-in-progress: true

jobs:
  buyer-visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORIGIN: https://x402-canary.nicolas-x402-16f380a7.workers.dev
    steps:
      - name: Initialize report
        shell: bash
        run: |
          printf '%s\n' "commit=${GITHUB_SHA}" "origin=${ORIGIN}" "run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" > /tmp/distribution-report.txt

      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Verify source gate independently of Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          echo 'SOURCE_GATE_GREEN=1' >> /tmp/distribution-report.txt

      - name: Wait for active 32-route Cloudflare runtime
        shell: bash
        run: |
          set -euo pipefail
          count=0
          funnel=false
          for attempt in $(seq 1 36); do
            health="$(curl -fsS --max-time 15 "$ORIGIN/health" || true)"
            count="$(node -e 'try{const j=JSON.parse(process.argv[1]);process.stdout.write(String(j.routes||0))}catch{process.stdout.write("0")}' "$health")"
            funnel="$(node -e 'try{const j=JSON.parse(process.argv[1]);process.stdout.write(String(j.free_need_router===true))}catch{process.stdout.write("false")}' "$health")"
            echo "runtime attempt=$attempt routes=$count free_need_router=$funnel"
            if [ "$count" = "32" ] && [ "$funnel" = "true" ]; then break; fi
            sleep 10
          done
          echo "runtime_routes=${count}" >> /tmp/distribution-report.txt
          echo "free_need_router=${funnel}" >> /tmp/distribution-report.txt
          test "$count" = "32"
          test "$funnel" = "true"
          echo 'RUNTIME_32_GREEN=1' >> /tmp/distribution-report.txt

      - name: Verify public distribution surface
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          last_code=000
          for attempt in $(seq 1 30); do
            last_code="$(curl -sS --max-time 20 -o /tmp/distribution.json -w '%{http_code}' "$ORIGIN/distribution" || true)"
            echo "distribution attempt=$attempt status=$last_code"
            if [ "$last_code" = "200" ]; then
              if node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync("/tmp/distribution.json","utf8"));process.exit(d.status==="public"&&d.paid_route_count===32&&d.buyer_bridge?.provider==="AgentCash"&&d.free_need_router?.price_usd===0&&d.free_need_router?.raw_task_stored===false?0:1)}catch{process.exit(1)}'; then ok=1; break; fi
            fi
            sleep 10
          done
          echo "distribution_http=${last_code}" >> /tmp/distribution-report.txt
          test "$ok" = "1"
          curl -fsS --max-time 20 "$ORIGIN/skill.md" -o /tmp/skill.md
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/distribution.json','utf8'));
          const ids = (d.capabilities || []).map(x => x.id);
          for (const id of ['npm-symbol-context','npm-api-diff','browser-context']) if (!ids.includes(id)) throw new Error(`distribution_missing=${id}`);
          const skill = fs.readFileSync('/tmp/skill.md','utf8');
          for (const phrase of ['find_paid_tool','https://agentcash.dev/skill.md','npm docs','breaking changes','browser snapshot']) if (!skill.includes(phrase)) throw new Error(`skill_phrase_missing=${phrase}`);
          NODE
          echo 'PUBLIC_DISTRIBUTION_GREEN=1' >> /tmp/distribution-report.txt

      - name: Verify free need-to-paid funnel
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS --max-time 20 -o /tmp/need.json -w '%{http_code}' -X POST "$ORIGIN/agent/find-tool" \
            -H 'content-type: application/json' \
            -H 'x-agent-channel: ci:need-funnel-smoke' \
            --data '{"task":"Need the exact current TypeScript API signature for an npm package symbol before coding because local types are absent","missing_capability":"current npm docs TypeScript API signature","max_price_usd":0.02,"local_evidence_sufficient":false}')"
          test "$code" = "200"
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/need.json','utf8'));
          const d=j.data||{};
          if (d.next_action !== 'BUY_RECOMMENDED_TOOL') throw new Error(`need_action=${d.next_action}`);
          if (d.recommendation?.route_id !== 'npm-symbol-context') throw new Error(`need_route=${d.recommendation?.route_id}`);
          if (d.recommendation?.price_usd !== 0.015) throw new Error(`need_price=${d.recommendation?.price_usd}`);
          if (d.raw_task_stored !== false) throw new Error('raw_task_storage_red');
          if (d.channel !== 'ci:need-funnel-smoke') throw new Error(`need_channel=${d.channel}`);
          NODE
          curl -fsS --max-time 20 -X POST "$ORIGIN/mcp" -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' -o /tmp/mcp-tools.json
          node <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('/tmp/mcp-tools.json','utf8'));
          const tools=j.result?.tools||[];
          if (!tools.some(t=>t.name==='find_paid_tool')) throw new Error('mcp_need_router_missing');
          NODE
          echo 'NEED_FUNNEL_GREEN=1' >> /tmp/distribution-report.txt

      - name: Verify exact OpenAPI paid launch surface
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$ORIGIN/openapi.json" -o /tmp/openapi.json
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/openapi.json','utf8'));
          const paths = Object.keys(d.paths || {});
          const required = ['/v1/agent/npm-symbol-context','/v1/agent/npm-api-diff','/v1/agent/browser-context','/v1/agent/dependency-gate','/v1/agent/release-gate'];
          if (paths.length !== 32) throw new Error(`openapi_route_count=${paths.length}`);
          for (const p of required) if (!d.paths?.[p]?.post) throw new Error(`missing_openapi_route=${p}`);
          const text = JSON.stringify(d.info || {}).toLowerCase();
          for (const keyword of ['npm docs','breaking changes','browser snapshot']) if (!text.includes(keyword)) throw new Error(`openapi_keyword_missing=${keyword}`);
          if (!d.info?.contact?.email && !d.info?.contact?.url) throw new Error('openapi_contact_missing');
          NODE
          echo 'OPENAPI_32_GREEN=1' >> /tmp/distribution-report.txt

      - name: Verify three new paid routes challenge with x402
        shell: bash
        run: |
          set -euo pipefail
          probe_402() {
            path="$1"
            ok=0
            for attempt in $(seq 1 4); do
              rm -f /tmp/h /tmp/b
              code="$(curl -sS --connect-timeout 10 --max-time 45 -D /tmp/h -o /tmp/b -w '%{http_code}' -X POST "$ORIGIN$path" -H 'content-type: application/json' --data '{}' || true)"
              echo "$path attempt=$attempt status=$code"
              if [ "$code" = "402" ] && grep -qi '^payment-required:' /tmp/h 2>/dev/null; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = "1"
          }
          probe_402 /v1/agent/npm-symbol-context
          probe_402 /v1/agent/npm-api-diff
          probe_402 /v1/agent/browser-context
          echo 'NEW_ROUTES_402_GREEN=1' >> /tmp/distribution-report.txt

      - name: Validate AgentCash discovery contract
        shell: bash
        run: |
          set -euo pipefail
          npx -y @agentcash/discovery@latest discover "$ORIGIN" --json | tee /tmp/agentcash-discover.json
          grep -q 'npm-symbol-context' /tmp/agentcash-discover.json
          grep -q 'npm-api-diff' /tmp/agentcash-discover.json
          grep -q 'browser-context' /tmp/agentcash-discover.json
          for path in npm-symbol-context npm-api-diff browser-context; do
            npx -y @agentcash/discovery@latest check "$ORIGIN/v1/agent/$path" --json | tee "/tmp/check-$path.json"
          done
          echo 'AGENTCASH_DISCOVERY_GREEN=1' >> /tmp/distribution-report.txt

      - name: Verify buyer natural-language search; refresh registry if needed
        shell: bash
        run: |
          set -euo pipefail
          search_one() {
            query="$1"
            expected="$2"
            outfile="$3"
            output="$(npx -y agentcash@latest search "$query" 2>&1 || true)"
            printf '%s\n' "$output" | tee "$outfile"
            printf '%s' "$output" | grep -Fq "$expected"
          }
          search_all() {
            search_one 'npm docs TypeScript API package symbols' '/v1/agent/npm-symbol-context' /tmp/search-symbol.txt && \
            search_one 'npm package upgrade breaking changes migration API diff' '/v1/agent/npm-api-diff' /tmp/search-diff.txt && \
            search_one 'browser snapshot rendered web page JavaScript accessibility' '/v1/agent/browser-context' /tmp/search-browser.txt
          }
          if search_all; then
            echo 'AGENTCASH_INDEX_ALREADY_VISIBLE=1' >> /tmp/distribution-report.txt
            echo 'AGENTCASH_BUYER_SEARCH_GREEN=1' >> /tmp/distribution-report.txt
            exit 0
          fi
          echo 'AGENTCASH_INDEX_REFRESH_NEEDED=1' >> /tmp/distribution-report.txt
          body="$(printf '{\"origin\":\"%s\"}' "$ORIGIN")"
          set +e
          npx -y agentcash@latest fetch 'https://x402scan.com/api/x402/registry/register-origin' -m POST -b "$body" | tee /tmp/agentcash-register.txt
          register_rc=${PIPESTATUS[0]}
          set -e
          echo "agentcash_register_rc=${register_rc}" >> /tmp/distribution-report.txt
          visible=0
          for attempt in $(seq 1 12); do
            echo "buyer-search retry=$attempt"
            if search_all; then visible=1; break; fi
            sleep 15
          done
          test "$visible" = "1"
          echo 'AGENTCASH_BUYER_SEARCH_GREEN=1' >> /tmp/distribution-report.txt

      - name: Publish observable verdict
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status='${{ job.status }}'
          {
            echo "## Distribution visibility gate — ${status}"
            echo
            echo '```text'
            cat /tmp/distribution-report.txt 2>/dev/null || true
            echo '```'
            for f in /tmp/need.json /tmp/distribution.json /tmp/agentcash-discover.json /tmp/agentcash-register.txt /tmp/search-symbol.txt /tmp/search-diff.txt /tmp/search-browser.txt; do
              if [ -f "$f" ]; then
                echo
                echo "### $(basename "$f") — tail"
                echo '```text'
                tail -n 35 "$f"
                echo '```'
              fi
            done
          } > /tmp/gate-comment.md
          gh issue comment 1 --repo "$GITHUB_REPOSITORY" --body-file /tmp/gate-comment.md
