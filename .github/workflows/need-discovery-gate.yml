name: x402 Need Discovery Harness Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "buyer-lab/**"
      - ".github/workflows/need-discovery-gate.yml"

permissions:
  contents: read

concurrency:
  group: x402-need-discovery-harness
  cancel-in-progress: true

jobs:
  verify-no-paid-gateway-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Verify local CLI harness only
        shell: bash
        run: |
          set -euo pipefail
          test -f buyer-lab/cli-provider.mjs
          test -f buyer-lab/run-local-need-discovery.ps1
          test -f buyer-lab/need-discovery-pilot.yaml
          node --check buyer-lab/cli-provider.mjs
          if grep -R -n -E 'VERCEL_AI_GATEWAY_API_KEY|id:[[:space:]]*vercel:' buyer-lab/need-discovery-pilot.yaml buyer-lab/cli-provider.mjs buyer-lab/run-local-need-discovery.ps1; then
            echo 'PAID_GATEWAY_REFERENCE_RED=1'
            exit 1
          fi
          grep -Fq 'exec: node cli-provider.mjs codex' buyer-lab/need-discovery-pilot.yaml
          grep -Fq 'exec: node cli-provider.mjs claude' buyer-lab/need-discovery-pilot.yaml
          grep -Fq 'exec: node cli-provider.mjs gemini' buyer-lab/need-discovery-pilot.yaml
          grep -Fq 'maxConcurrency: 1' buyer-lab/need-discovery-pilot.yaml
          echo 'NEED_DISCOVERY_HARNESS_GREEN=1'
          echo 'INFERENCE_RUN=LOCAL_ONLY'
          echo 'PAID_AI_GATEWAY=0'

      - name: Clarify evidence boundary
        shell: bash
        run: |
          echo 'This workflow validates only the no-gateway harness.'
          echo 'NEED_DISCOVERY_GREEN must not be claimed until buyer-lab/run-local-need-discovery.ps1 produces a real 3-CLI result artifact.'
