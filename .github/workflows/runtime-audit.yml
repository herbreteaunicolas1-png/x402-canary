name: x402 Runtime Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout canonical repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Offline gates
        run: npm run check

      - name: Wait for public origin
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://x402-canary.nicolas-x402-16f380a7.workers.dev'
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$ORIGIN/health"; then
              exit 0
            fi
            sleep 10
          done
          echo 'PUBLIC_ORIGIN_UNREACHABLE' >&2
          exit 1

      - name: Diagnose x402scan-skipped routes without payment
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://x402-canary.nicolas-x402-16f380a7.workers.dev'
          probe() {
            local path="$1"
            local body="$2"
            local headers bodyfile status
            headers="$(mktemp)"
            bodyfile="$(mktemp)"
            status="$(curl -sS --max-time 20 -D "$headers" -o "$bodyfile" -w '%{http_code}' -X POST "$ORIGIN$path" -H 'content-type: application/json' --data-binary "$body")"
            echo "PROBE path=$path status=$status"
            if grep -qi '^payment-required:' "$headers"; then
              echo 'PAYMENT_REQUIRED_HEADER=YES'
            else
              echo 'PAYMENT_REQUIRED_HEADER=NO'
            fi
            echo 'BODY_BEGIN'
            head -c 600 "$bodyfile" || true
            echo
            echo 'BODY_END'
            rm -f "$headers" "$bodyfile"
          }
          probe '/v1/fx/rate' '{"base":"USD","quote":"EUR"}'
          probe '/v1/exchange-rates' '{"base":"USD","quote":"EUR"}'
          probe '/v1/fx/convert' '{"base":"USD","quote":"EUR","amount":1}'
          probe '/v1/currency-convert' '{"base":"USD","quote":"EUR","amount":1}'
          probe '/v1/seismic/recent' '{}'
          probe '/v1/cron/validate' '{"expression":"* * * * *"}'
          probe '/v1/email/domain-check' '{"email":"test@example.com"}'

      - name: Canonical 32-route x402 v2 and Bazaar gate
        run: >-
          node --experimental-strip-types scripts/verify-runtime.mjs
          --origin https://x402-canary.nicolas-x402-16f380a7.workers.dev
          --network eip155:8453
          --payee 0xa42a56C5Ad4E60CE4e45Bf8844656A496F5D9aB8
