name: x402 v0.5 Bootstrap and CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated x402 repository
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Materialize canonical v0.5 source if needed
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package.json ]; then
            echo "materialized=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          test -d bootstrap
          cat bootstrap/archive.part*.b64 > /tmp/x402-v05.b64
          base64 --decode /tmp/x402-v05.b64 > /tmp/x402-v05.zip

          ACTUAL_SHA="$(sha256sum /tmp/x402-v05.zip | awk '{print $1}')"
          EXPECTED_SHA="5677eb54c2b073e603ae435ff9502c9b19bc04326b52e0a6f2efff01eb989d8c"
          echo "archive_sha256=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          rm -rf /tmp/x402-v05-src
          mkdir -p /tmp/x402-v05-src
          unzip -q /tmp/x402-v05.zip -d /tmp/x402-v05-src
          shopt -s dotglob
          cp -R /tmp/x402-v05-src/* .

          test -f package.json
          test -f src/index.ts
          test -f src/agent-security.ts
          test -f test/agent-security.test.ts
          test -f AGENT_PREFLIGHT_PRODUCT_V0_5.md
          test -f distribution/claude-plugin/skills/x402-agent-preflight/SKILL.md
          test -f distribution/codex-skill/x402-agent-preflight/SKILL.md
          test -f distribution/gemini-extension/gemini-extension.json

          rm -rf bootstrap /tmp/x402-v05.b64 /tmp/x402-v05.zip /tmp/x402-v05-src
          echo "materialized=true" >> "$GITHUB_OUTPUT"

      - name: Generate deterministic npm lock
        if: steps.materialize.outputs.materialized == 'true'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Require lockfile
        run: test -f package-lock.json

      - name: Install exact dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Contract and security tests
        run: npm test

      - name: TypeScript gate
        run: npm run typecheck

      - name: Offline authority and secret gate
        run: npm run gate:offline

      - name: Cloudflare Worker dry run only
        run: npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Commit verified materialized source
        if: steps.materialize.outputs.materialized == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build: materialize verified x402 v0.5 source and lock"
          git push
