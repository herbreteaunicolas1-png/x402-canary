# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: x402 Buyer Lab - voluntary paid-tool selection by GPT, Claude and Gemini

prompts:
  - file://prompt.txt

providers:
  - id: openai:gpt-5.6
    label: GPT-5.6
    config:
      tools: file://tools.json
      tool_choice: auto
  - id: anthropic:messages:claude-opus-4-6
    label: Claude Opus 4.6
    config:
      tools: file://tools.json
      tool_choice: auto
  - id: google:gemini-3.1-pro-preview
    label: Gemini 3.1 Pro Preview
    config:
      tools: file://tools.json
      tool_choice: auto

tests: file://tests.csv

commandLineOptions:
  maxConcurrency: 3
  repeat: 3
  delay: 250
  cache: false
  share: false
  write: true
