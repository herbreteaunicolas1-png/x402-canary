# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Coding-agent Need Discovery Lab - local subscription/login harness, no paid AI gateway

prompts:
  - file://need-discovery-prompt.txt

providers:
  - id: "exec: node cli-provider.mjs codex"
    label: Codex CLI GPT-5.6 Sol via ChatGPT login
  - id: "exec: node cli-provider.mjs claude"
    label: Claude Code Opus via Claude app login
  - id: "exec: node cli-provider.mjs gemini"
    label: Gemini CLI via Google login

tests: file://need-discovery.csv

defaultTest:
  assert:
    - type: is-json

commandLineOptions:
  maxConcurrency: 1
  repeat: 1
  delay: 750
  cache: false
  share: false
  write: true
