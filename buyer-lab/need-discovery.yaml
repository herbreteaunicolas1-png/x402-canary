# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Coding-agent Need Discovery Lab - external capabilities before products

prompts:
  - file://need-discovery-prompt.txt

providers:
  - id: openai:responses:gpt-5.6-sol
    label: GPT-5.6 Sol
    config:
      reasoning:
        effort: medium
      max_output_tokens: 900
  - id: anthropic:messages:claude-opus-4-6
    label: Claude Opus 4.6
    config:
      apiKeyRequired: false
      max_tokens: 900
      temperature: 0
  - id: google:gemini-3.1-pro-preview
    label: Gemini 3.1 Pro Preview
    config:
      maxOutputTokens: 900
      temperature: 0

tests: file://need-discovery.csv

defaultTest:
  assert:
    - type: is-json

commandLineOptions:
  maxConcurrency: 3
  repeat: 2
  delay: 250
  cache: false
  share: false
  write: true
