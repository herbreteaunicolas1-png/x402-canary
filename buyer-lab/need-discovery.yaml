# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Coding-agent Need Discovery Lab - external capabilities before products

prompts:
  - file://need-discovery-prompt.txt

# One authenticated gateway, three independent frontier model families.
# Promptfoo 0.122.0 supports the native `vercel:` provider.
# Current model slugs verified against Vercel AI Gateway on 2026-08-21.
providers:
  - id: vercel:openai/gpt-5.6-sol
    label: GPT-5.6 Sol
    config:
      apiKeyEnvar: VERCEL_AI_GATEWAY_API_KEY
      maxTokens: 900
      timeout: 90000
  - id: vercel:anthropic/claude-opus-5
    label: Claude Opus 5
    config:
      apiKeyEnvar: VERCEL_AI_GATEWAY_API_KEY
      maxTokens: 900
      timeout: 90000
  - id: vercel:google/gemini-3.1-pro-preview
    label: Gemini 3.1 Pro Preview
    config:
      apiKeyEnvar: VERCEL_AI_GATEWAY_API_KEY
      maxTokens: 900
      timeout: 90000

tests: file://need-discovery.csv

defaultTest:
  assert:
    - type: is-json

commandLineOptions:
  maxConcurrency: 3
  repeat: 2
  delay: 250
  cache: false
  share: false
  write: true
