# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Coding-agent Need Discovery Pilot - bounded cross-model calibration

prompts:
  - file://need-discovery-prompt.txt

providers:
  - id: vercel:openai/gpt-5.6-sol
    label: GPT-5.6 Sol
    config:
      apiKeyEnvar: VERCEL_AI_GATEWAY_API_KEY
      maxTokens: 450
      timeout: 90000
  - id: vercel:anthropic/claude-opus-5
    label: Claude Opus 5
    config:
      apiKeyEnvar: VERCEL_AI_GATEWAY_API_KEY
      maxTokens: 450
      timeout: 90000
  - id: vercel:google/gemini-3.1-pro-preview
    label: Gemini 3.1 Pro Preview
    config:
      apiKeyEnvar: VERCEL_AI_GATEWAY_API_KEY
      maxTokens: 450
      timeout: 90000

tests: file://need-discovery-pilot.csv

defaultTest:
  assert:
    - type: is-json

commandLineOptions:
  maxConcurrency: 3
  repeat: 1
  delay: 250
  cache: false
  share: false
  write: true
